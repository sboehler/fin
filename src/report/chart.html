<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}}</title>
    <style>
      /* Palette from the validated categorical set: slots blue/orange/aqua.
         Three categories is the most an all-pairs-compared chart can keep
         apart under simulated colour-blindness. Dark values are the same
         hues re-stepped for the dark surface, not an automatic flip. */
      .viz-root {
        color-scheme: light;
        --surface-1: #fcfcfb;
        --text-primary: #0b0b0b;
        --text-secondary: #52514e;
        --cat-source: #1baf7a;
        --cat-hub: #2a78d6;
        --cat-sink: #eb6834;
        --ribbon-opacity: 0.3;
      }
      @media (prefers-color-scheme: dark) {
        :root:where(:not([data-theme="light"])) .viz-root {
          color-scheme: dark;
          --surface-1: #1a1a19;
          --text-primary: #ffffff;
          --text-secondary: #c3c2b7;
          --cat-source: #199e70;
          --cat-hub: #3987e5;
          --cat-sink: #d95926;
          --ribbon-opacity: 0.5;
        }
      }
      :root[data-theme="dark"] .viz-root {
        color-scheme: dark;
        --surface-1: #1a1a19;
        --text-primary: #ffffff;
        --text-secondary: #c3c2b7;
        --cat-source: #199e70;
        --cat-hub: #3987e5;
        --cat-sink: #d95926;
        --ribbon-opacity: 0.5;
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        overflow-x: hidden;
      }
      .viz-root {
        background: var(--surface-1);
        color: var(--text-primary);
        font:
          14px/1.5 ui-sans-serif,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        min-height: 100vh;
        padding: 32px clamp(16px, 4vw, 48px);
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0;
      }
      .subtitle {
        color: var(--text-secondary);
        margin: 4px 0 0;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        list-style: none;
        margin: 20px 0 0;
        padding: 0;
      }
      .legend li {
        align-items: center;
        color: var(--text-secondary);
        display: flex;
        gap: 7px;
      }
      /* The swatch carries the identity; the text stays in ink tokens. */
      .swatch {
        border-radius: 3px;
        display: inline-block;
        height: 10px;
        width: 10px;
      }
      .swatch[data-category="source"] {
        background: var(--cat-source);
      }
      .swatch[data-category="hub"] {
        background: var(--cat-hub);
      }
      .swatch[data-category="sink"] {
        background: var(--cat-sink);
      }
      #chart {
        margin-top: 12px;
        width: 100%;
      }
      .empty {
        color: var(--text-secondary);
        padding: 48px 0;
      }
    </style>
  </head>
  <body>
    <main class="viz-root">
      <header>
        <h1>{{TITLE}}</h1>
        <p class="subtitle">{{SUBTITLE}}</p>
      </header>
      <ul class="legend">
        <li><span class="swatch" data-category="source"></span>Income</li>
        <li><span class="swatch" data-category="hub"></span>Accounts</li>
        <li><span class="swatch" data-category="sink"></span>Expenses</li>
      </ul>
      <div id="chart"></div>
    </main>
    <script>
      {{ECHARTS}}
    </script>
    <script>
      const option = {{OPTION}};
      const root = document.querySelector(".viz-root");
      const container = document.getElementById("chart");
      const nodes = option.series[0].data;

      if (!nodes.length) {
        container.className = "empty";
        container.textContent = "No flows in this period.";
      } else {
        // Fill exactly the space left below the header so the page does not
        // scroll, but never squeeze nodes below the point where their labels
        // collide -- past that the chart scrolls and -m or --min is the fix.
        const MIN_PER_NODE = 24;
        const MIN_HEIGHT = 300;
        const BOTTOM_GAP = 32; // the .viz-root bottom padding
        function height() {
          // offsetTop rather than getBoundingClientRect, so a scrolled page
          // does not feed its scroll offset back into the height.
          const available = window.innerHeight - container.offsetTop - BOTTOM_GAP;
          return Math.max(available, MIN_HEIGHT, nodes.length * MIN_PER_NODE);
        }
        container.style.height = height() + "px";
        const chart = echarts.init(container);
        const amount = new Intl.NumberFormat(undefined, {
          maximumFractionDigits: 2,
          minimumFractionDigits: 2,
        });

        // The palette lives in CSS so light and dark have one definition each;
        // read it back rather than duplicating the hexes here.
        function palette() {
          const style = getComputedStyle(root);
          const read = (name) => style.getPropertyValue(name).trim();
          return {
            source: read("--cat-source"),
            hub: read("--cat-hub"),
            sink: read("--cat-sink"),
            text: read("--text-primary"),
            muted: read("--text-secondary"),
            surface: read("--surface-1"),
            // Ribbons need more presence on the dark surface to stay legible.
            ribbon: Number(read("--ribbon-opacity")),
          };
        }

        function render() {
          const colors = palette();
          for (const node of nodes) {
            node.itemStyle = { color: colors[node.category] };
          }
          chart.setOption({
            ...option,
            textStyle: { color: colors.text },
            tooltip: {
              ...option.tooltip,
              backgroundColor: colors.surface,
              borderColor: colors.muted,
              textStyle: { color: colors.text },
              formatter: (p) =>
                p.dataType === "edge"
                  ? `${p.data.source} → ${p.data.target}<br><b>${amount.format(p.data.value)}</b>`
                  : `<b>${p.name}</b>`,
            },
            series: [
              {
                ...option.series[0],
                data: nodes,
                lineStyle: { ...option.series[0].lineStyle, opacity: colors.ribbon },
                // Node names are always shown: they are the secondary encoding
                // that lets the chart read without relying on colour.
                label: { color: colors.text, fontSize: 12 },
              },
            ],
          });
        }

        render();
        window.addEventListener("resize", () => {
          container.style.height = height() + "px";
          chart.resize();
        });
        // The canvas cannot inherit the CSS variables, so it has to be redrawn
        // on either theme signal: the OS setting and the data-theme stamp.
        matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
        new MutationObserver(render).observe(document.documentElement, {
          attributeFilter: ["data-theme"],
        });
      }
    </script>
  </body>
</html>
